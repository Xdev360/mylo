<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:#09090B; color:#fff;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    position:relative; width:1200px; height:630px; overflow:hidden;
    background:
      radial-gradient(760px 620px at 84% 40%, rgba(120,120,200,.16), transparent 62%),
      radial-gradient(520px 460px at 92% 86%, rgba(255,202,40,.10), transparent 64%),
      radial-gradient(640px 520px at 6% 4%,  rgba(70,193,253,.075), transparent 60%),
      #09090B;
  }
  /* faint grid, barely there - gives the flat black some surface */
  .card::before{
    content:""; position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
    background-size:60px 60px;
    -webkit-mask-image:radial-gradient(900px 620px at 50% 45%, #000 30%, transparent 78%);
            mask-image:radial-gradient(900px 620px at 50% 45%, #000 30%, transparent 78%);
  }
  /* edge definition so the card never melts into a black chat bubble */
  .card::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.075), inset 0 0 180px rgba(0,0,0,.55);
  }
  .inner{position:absolute; inset:0; padding:66px 72px; display:flex; z-index:2}
  .left{
    flex:0 0 640px; display:flex; flex-direction:column;
    justify-content:space-between; align-items:flex-start;
  }

  .brand{display:flex; align-items:center; gap:15px}
  .mark{
    width:52px; height:52px; border-radius:16px; background:#fff;
    display:grid; place-items:center; flex:none;
    box-shadow:0 6px 22px rgba(0,0,0,.5);
  }
  .mark svg{width:33px; height:42px; display:block; margin-top:2px}
  .brand b{font-size:33px; font-weight:700; letter-spacing:-.022em}

  h1{
    font-size:76px; line-height:1.045; font-weight:700;
    letter-spacing:-.042em; text-wrap:balance; max-width:600px;
    margin:6px 0 0;
  }
  h1 .dim{color:#7C7C85}

  .foot{display:flex; align-items:center; gap:15px}
  .pill{
    background:#fff; color:#0A0A0B; font-weight:700; font-size:20px;
    letter-spacing:-.012em; padding:11px 22px; border-radius:999px;
    box-shadow:0 8px 26px rgba(0,0,0,.55);
  }
  .foot span{color:#85858E; font-size:21px; font-weight:500; letter-spacing:-.012em}

  /* ---- the huddle: they overlap, because the line says "together" ---- */
  .crew{position:relative; flex:1; align-self:stretch}
  .crew svg{
    position:absolute; display:block;
    filter:drop-shadow(0 20px 34px rgba(0,0,0,.66));
  }
  .g-soft  {left:  0px; top: 92px; width:156px; height:198px; transform:rotate(-11deg)}
  .g-party {left:206px; top: 14px; width:156px; height:247px; transform:rotate(10deg)}
  .g-laugh {left: 40px; top:222px; width:182px; height:231px; transform:rotate(-5deg)}
  .g-crown {left:200px; top:172px; width:190px; height:305px; transform:rotate(6deg)}
</style></head><body>
