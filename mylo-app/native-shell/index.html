<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mylo</title>
<style>
  :root{ color-scheme:light dark; }
  html,body{ height:100%; margin:0; background:#FFFFFF; color:#0F0F12; font:500 15px/1.5 -apple-system, system-ui, sans-serif; }
  @media (prefers-color-scheme: dark){ html,body{ background:#161618; color:#F5F5F7; } }
  main{ height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; text-align:center; padding:24px; }
  img{ width:96px; height:96px; border-radius:50%; }
  h1{ margin:8px 0 0; font-size:22px; font-weight:600; }
  p{ margin:0; opacity:.7; }
</style>
</head>
<body>
<!-- Shown only when the app opens with no connection: the app itself loads
     from the server set in capacitor.config.ts. -->
<main>
  <img src="mylo-logo-192.webp" alt="">
  <h1>No connection</h1>
  <p>Mylo needs the internet to open. Check your connection and try again.</p>
</main>
</body>
</html>
