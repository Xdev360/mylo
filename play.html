<!doctype html>
<html lang="en" data-mood="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://bjenyxrxbfgphnbncnwv.supabase.co; connect-src 'self' https://bjenyxrxbfgphnbncnwv.supabase.co; worker-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>Play on Mylo</title>
<meta name="robots" content="noindex">
<meta name="description" content="Someone sent you a game. No account needed.">
<meta property="og:title" content="Someone sent you a game">
<meta property="og:description" content="One game, in your browser. No sign-up.">
<meta property="og:image" content="https://staymylo.com/og.png">
<link rel="icon" href="/assets/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Deliberately its own stylesheet. A guest should download a page, not an app —
   and nothing here may depend on a signed-in Mylo being loaded. */
:root{
  --bg:#0A0A0B; --surface:rgba(255,255,255,.045); --surface-2:rgba(255,255,255,.075);
  --border:rgba(255,255,255,.09); --ink:#FAFAFA; --muted:rgba(250,250,250,.52);
  --accent:#F97316; --glass:rgba(20,20,24,.88);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:radial-gradient(760px 520px at 50% -10%, rgba(249,115,22,.22), transparent 62%), var(--bg);
  color:var(--ink);font:15px/1.5 Inter,-apple-system,system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;
  padding:max(18px,env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
}
.wrap{width:min(440px,100%);display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;gap:9px;padding:2px 2px 4px}
.top img{width:26px;height:26px}
.top b{font-size:15px;font-weight:800;letter-spacing:-.02em}
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:22px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);text-align:center;
}
.kick{font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--accent);margin:0 0 12px}
h1{font-size:23px;line-height:1.2;margin:0 0 6px;letter-spacing:-.02em}
p.sub{margin:0;color:var(--muted);font-size:14px}
input[type=text]{
  width:100%;margin-top:16px;height:48px;padding:0 16px;border-radius:14px;font:inherit;font-size:16px;
  background:var(--surface-2);border:1px solid var(--border);color:var(--ink);outline:0;
}
input[type=text]:focus{border-color:rgba(255,255,255,.28)}
.btn{
  width:100%;margin-top:12px;min-height:50px;border:0;border-radius:100px;cursor:pointer;
  background:var(--ink);color:#0A0A0B;font:inherit;font-size:15px;font-weight:700;
}
.btn:disabled{opacity:.5}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--border)}
.status{
  text-align:center;font-size:14px;font-weight:600;color:var(--muted);
  padding:10px 14px;border-radius:100px;background:var(--surface);border:1px solid var(--border);
}
.status.you{color:var(--ink);border-color:rgba(255,255,255,.22)}
.who{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);padding:0 4px}
.who b{color:var(--ink);font-weight:700}
.board-wrap{display:flex;justify-content:center}
/* chess */
.cb{display:grid;grid-template-columns:repeat(8,1fr);width:min(392px,92vw);aspect-ratio:1;
  border-radius:16px;overflow:hidden;border:1px solid var(--border)}
.csq{border:0;padding:0;display:grid;place-items:center;background:#E8E3DA;cursor:pointer;position:relative}
.csq.d{background:#8A7F72}
.csq.sel{box-shadow:inset 0 0 0 3px var(--accent)}
.csq.tgt::after{content:"";width:26%;height:26%;border-radius:50%;background:rgba(249,115,22,.75)}
.csq svg{width:80%;height:80%;display:block}
.csq:disabled{cursor:default}
/* cards */
.pile{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0}
.pc{min-width:52px;height:74px;border-radius:11px;background:#fff;color:#111;display:grid;place-items:center;
  font-weight:800;font-size:19px;border:1px solid rgba(0,0,0,.15);flex:none;line-height:1.05;padding:4px}
.pc.red{color:#D42A2A}
.pc.big{min-width:64px;height:90px;font-size:23px}
.pc.dim{opacity:.4}
.hand{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.hand .pc{cursor:pointer}
.deck{min-width:52px;height:74px;border-radius:11px;background:var(--surface-2);border:1px dashed var(--border);
  display:grid;place-items:center;color:var(--muted);font-weight:700;font-size:13px;flex:none}
.rc{width:22px;height:22px;border-radius:50%;flex:none}
.suits{display:flex;gap:8px;justify-content:center;margin-top:10px}
.suits button{width:46px;height:46px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);
  color:var(--ink);font-size:20px;cursor:pointer}
.hint{text-align:center;font-size:13px;color:var(--muted)}
.foot{text-align:center;font-size:12px;color:rgba(250,250,250,.32);margin-top:6px}
.link{display:block;margin-top:14px;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.err{color:#FCA5A5;font-size:13px;margin-top:10px}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><img src="/assets/characters/happy-2.svg" alt=""><b>Mylo</b></div>
  <div id="view"><div class="card"><p class="sub">Loading the game…</p></div></div>
  <p class="foot">One game, in your browser. Nothing to install.</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"></script>
<script src="/js/config.js"></script>
<script src="/js/games.js?v=20260921h"></script>
<script src="/js/play.js?v=20260921h"></script>
</body>
</html>
